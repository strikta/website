name: check

# Fork pull requests run here with a read-only token and no secrets; this repository holds no deploy secret.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
      - name: Scan every tracked file
        run: git ls-files -z | xargs -0 node tool/check.ts scan
      # The local pre-push check can be bypassed; this one cannot. Only the base stays a remote ref, so every commit of the pull request counts as unpushed.
      - name: Check the pull request's branch name and every commit's message, file names and content
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git for-each-ref --format='%(refname)' refs/remotes | xargs -r -n 1 git update-ref -d --no-deref
          git update-ref refs/remotes/origin/base "$BASE"
          printf 'refs/heads/%s %s refs/heads/%s %s\n' "$BRANCH" "$HEAD" "$BRANCH" "$BASE" | node tool/check.ts pushed
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run gate

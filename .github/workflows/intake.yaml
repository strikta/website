name: intake

# Closes a pull request from an outside contributor that links no issue (CONTRIBUTING, "Before you
# open a PR"). pull_request_target runs in the base repository even for a fork, without approval,
# so this workflow never checks out or runs pull request code: it reads only the event payload and
# calls the API through the gh CLI preinstalled on the runner.
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close:
    # The owner, members and collaborators, and the dependency bot this repository runs, are exempt;
    # so is a pull request a maintainer reopens, which is how one accepts it without an issue. Only
    # an opening and an author's reopen are checked, never an edit, so an accepted one stays open.
    if: >-
      github.event.pull_request.state == 'open'
      && (github.event.action == 'opened' || github.event.sender.login == github.event.pull_request.user.login)
      && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # The body arrives through the environment, never interpolated into the script.
      - name: Close a pull request that links no issue
        # A reference to another repository, such as the contributor's fork, links no issue here.
        run: |
          repository_pattern="${REPOSITORY//./\\.}"
          keyword='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+'
          issue_link="${keyword}(${repository_pattern})?#[0-9]+"
          issue_url="${keyword}https://github\.com/${repository_pattern}/issues/[0-9]+"
          if grep -Eiq -e "$issue_link" -e "$issue_url" <<< "$BODY"; then
            echo "Pull request #$NUMBER links an issue"
            exit 0
          fi
          gh pr close "$NUMBER" --repo "$REPOSITORY" --comment "$MESSAGE"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          MESSAGE: >-
            Thanks for the pull request. This repository takes outside pull requests only for an
            open issue, so a change is agreed before anyone writes or reviews it (see
            CONTRIBUTING.md). Please open an issue, or find an existing one, then open a new pull
            request whose description links it, for example "Closes #123".

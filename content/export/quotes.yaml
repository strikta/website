    employer or clients. You keep any rights the AGPL gives you anyway.

    It does not allow you to give Strikta or Strikta Pro to anyone else, to put Strikta
    inside a product others receive, or to run Strikta as a service for others. For
    that, your business needs our company licence (licensing@strikta.dev). If your
    employer pays for your licence, it is still a licence for you personally.

    It also includes email support (section 9), updates while your licence is current,
    and security releases for the support period (section 7).'
